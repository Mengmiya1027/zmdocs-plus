    **每日一言**：<span class="jinrishici-sentence"></span>
    <script src="https://sdk.jinrishici.com/v2/browser/jinrishici.js" charset="utf-8"></script>

# 让左侧栏 linklist 组件（如探索导航）左对齐
inject:
  head:
    - |
      <style>
      .widget-wrapper.linklist .linklist .link {
        justify-content: space-between;
        padding: 0 16px;
      }
      </style>
    - |
      <style>
      .banner .title {
          text-shadow: rgba(0, 0, 0, 0.2) 0px 2px 4px;
      }
      .leftbar-container {
          box-shadow: 0 1px 2px 0px rgba(0, 0, 0, 0.1);
      }
      </style>
    - |
      <style>
      /* ghrepo-zmdocs 仿制挂件：复用官方 .widget-wrapper.ghrepo 卡片样式，
         抵消 markdown 容器带来的面板背景与嵌套间距 */
      .widget-wrapper.markdown .widget-body > .widget-wrapper.ghrepo {
        margin-top: 0;
      }
      .widget-wrapper.markdown:has(> .widget-body > .widget-wrapper.ghrepo) .widget-body {
        background: transparent;
        padding: 0;
      }
      </style>
  script:
    - |
      <script>
      (function () {
        var BLOGGER = { lat: 28.8717, lng: 105.4424 }; // 泸州市
        function toRad(d) { return d * Math.PI / 180; }
        function haversine(lat1, lng1, lat2, lng2) {
          var R = 6371;
          var dLat = toRad(lat2 - lat1);
          var dLng = toRad(lng2 - lng1);
          var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                  Math.sin(dLng / 2) * Math.sin(dLng / 2);
          return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }
        window.__welcomeLoc = function (res) {
          var loc = document.getElementById('welcome-loc');
          var dist = document.getElementById('welcome-dist');
          if (!loc && !dist) return;
          if (res && res.status === 0 && res.result) {
            var r = res.result;
            var p = r.ad_info ? (r.ad_info.province || '') : '';
            var c = r.ad_info ? (r.ad_info.city || '') : '';
            var label = p + (c && c !== p ? ' ' + c : '');
            if (loc) loc.textContent = label || '未知位置';
            if (dist && r.location && BLOGGER.lat && BLOGGER.lng) {
              dist.textContent = Math.round(haversine(BLOGGER.lat, BLOGGER.lng, r.location.lat, r.location.lng));
            }
          }
        };
        var s = document.createElement('script');
        s.src = 'https://apis.map.qq.com/ws/location/v1/ip?key=CMRBZ-X3DC5-NXBIX-IIJYI-YY2J7-PDBJU&output=jsonp&callback=__welcomeLoc';
        document.head.appendChild(s);
      })();
      </script>

# 一旦设置源站地址，非源站地址将不会被SEO收录，并且访问时弹出提示
# 如果访问地址不在备用站主机列表，则警告信息为非法克隆
canonical:
  originalHost: zmdocs-plus.pages.dev # 主站点域名主机，例如 xaoxuu.com
  officialHosts: # 官方主机列表，每行一个，例如 xaoxuu.vercel.app
    - localhost

notebook:
  auto_excerpt: 100