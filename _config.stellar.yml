article:
  type: tech
  auto_excerpt: 200
  related_posts:
    enable: true
    title: 您可能感兴趣的文章
  license: '本文由 <a href="{author.url}">{author.name}</a> 编写，请你在改编、转载时注明出处，谢谢喵~'
  share: [wechat, weibo, email, link, qq, qzone]
logo:
  subtitle: '稚梦 · 随意写，随意看 | 我是爷们！'
menubar:
  columns: 4 # 一行多少个
  items: # 可按照自己需求增加，符合以下格式即可
   - id: post # 页面中高亮的 menu_id
     theme: '#1BCDFC' # 激活/悬停时的主题色，图标与圆点会以该颜色生成渐变
     icon: default:documents # 支持 svg/img 标签，可以定义在 icons.yml 文件中，也支持外部图片的 URL
     title: blog # 标题
     url: / # 跳转链接，支持相对路径和绝对路径
   - id: wiki
     theme: '#3DC550'
     icon: example:notebook
     title: XTC Root Helper
     url: /wiki/
   - id: notebooks
     theme: '#FA6400'
     icon: example:planet
     title: 探索
     url: /notes/
   - id: joint-building
     theme: '#F59E0B'
     icon: solar:face-scan-circle-bold-duotone
     title: 共建
     url: /notes/joint-building/
   - id: about
     theme: '#F44336'
     icon: solar:atom-bold-duotone
     title: 关于
     url: /about/introduction/

site_tree:
  notebooks:
    base_dir: notes # 笔记本列表页路径，改为 /notes/
    rightbar: welcome_info, ghrepo-zmdocs
  author:
    base_dir: author
    menu_id: about
    rightbar: welcome_info, ghrepo-zmdocs
  # 右侧栏：所有页面统一追加 welcome_info 欢迎组件
  home:
    rightbar: welcome_info, ghrepo-zmdocs
  index_blog:
    rightbar: welcome_info, ghrepo-zmdocs
  index_topic:
    rightbar: welcome_info, ghrepo-zmdocs
  index_wiki:
    rightbar: welcome_info, ghrepo-zmdocs
  post:
    rightbar: toc, welcome_info, ghrepo-zmdocs
  topic:
    rightbar: welcome_info, ghrepo-zmdocs
  notes:
    rightbar: welcome_info, ghrepo-zmdocs
  note:
    rightbar: toc, welcome_info, ghrepo-zmdocs
  page:
    rightbar: toc, welcome_info, ghrepo-zmdocs
  # 文档内页：官方 ghrepo 依赖 page.repo / wiki 仓库配置，无法渲染，改用仿制版
  wiki:
    rightbar: toc, welcome_info, ghrepo-zmdocs
  # 404 错误页
  error_page:
    rightbar: ghrepo-zmdocs

search:
  service: local_search
  local_search:
    field: all
    path: /search.json
    content: true
    skip_search: []
    codeblock: true

comments:
  service: giscus
  # giscus
  # https://giscus.app/zh-CN
  giscus:
    src: https://giscus.app/client.js
    data-repo: Mengmiya1027/ZMdocs # [在此输入仓库]
    data-repo-id: R_kgDOTlCvAA # [在此输入仓库 ID]
    data-category: Announcements # [在此输入分类名]
    data-category-id: DIC_kwDOTlCvAM4DDNw1
    data-mapping: pathname
    data-strict: 0
    data-reactions-enabled: 1
    data-emit-metadata: 0
    data-input-position: top # top, bottom
    data-theme: noborder_light
    data-lang: zh-CN
    data-loading: lazy
    crossorigin: anonymous

style:
  font-family:
    body: '"LXGW WenKai",sans-serif'
  leftbar:
    ui-style: glass

copycode:
  enable: true
  js: /js/plugins/copycode.js
  default_text: '复制' # 按钮显示文字
  success_text: '已经复制啦~' # 复制成功信息

# 文章底部「本文贡献者」与「编辑本文」：把本地 source 路径前缀映射到 GitHub 仓库
data_services:
  contributors:
    edit_this_page:
      '_posts/': https://github.com/Mengmiya1027/zmdocs-plus/blob/main/source/_posts/
      'wiki/': https://github.com/Mengmiya1027/zmdocs-plus/blob/main/source/wiki/
    js: /js/services/contributors.js

# GitHub API 加速源（gh* 系列组件：ghuser/ghrepo/ghissues 使用）

dependencies:
  lazyload:
    js: https://gcore.jsdelivr.net/npm/vanilla-lazyload@19.1/dist/lazyload.min.js
    transition: fade # blur, fade
    fix_ratio: true # true / false

# 默认打开
loading:
  loading: 加载中……请稍后~
  error: 加载失败T^T


