# 仿制官方 ghrepo 挂件：官方版依赖 page.repo / wiki 仓库配置，无配置时渲染为空；
# 此版固定展示 Mengmiya1027/ZMdocs-plus，已注册到所有页面的右侧栏。
# 结构与官方 layout/_partial/widgets/ghrepo.ejs 一致，复用官方 .ghrepo 卡片样式；
# 数据由主题自带的 /js/services/ghinfo.js 拉取（.ds-ghinfo）。
ghrepo-zmdocs:
  layout: markdown
  content: |
    <div class="widget-wrapper ghrepo">
      <div class="items data-service ds-ghinfo" data-api="https://api.github.com/repos/Mengmiya1027/ZMdocs-plus">
        <a class="repo" href="https://github.com/Mengmiya1027/ZMdocs-plus" target="_blank" rel="external nofollow noopener noreferrer">
          <div class="repo-name flex-row">
            <svg class="icon" data-icon="github:repo" aria-hidden="true"></svg>
            Mengmiya1027/ZMdocs-plus
          </div>
          <div class="repo-desc"><span type="text" id="description">&nbsp;</span></div>
          <div class="grid">
            <div class="flex-row">
              <svg class="icon" data-icon="github:star" aria-hidden="true"></svg>
              <span type="text" id="stargazers_count"></span>
            </div>
            <div class="flex-row">
              <svg class="icon" data-icon="github:fork" aria-hidden="true"></svg>
              <span type="text" id="forks_count"></span>
            </div>
            <div class="flex-row data-service ds-ghinfo" index="0" data-api="https://api.github.com/repos/Mengmiya1027/ZMdocs-plus/tags">
              <svg class="icon" data-icon="github:tag" aria-hidden="true"></svg>
              <span type="text" id="latest-tag-name">0</span>
            </div>
          </div>
        </a>
      </div>
    </div>
